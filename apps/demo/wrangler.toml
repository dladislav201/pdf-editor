# Public site, served as static assets on Cloudflare Workers (the successor of
# Pages), with a small API under /api for anonymous usage counts and
# feedback. Deploy with `npm run deploy:demo` from the repo root.
name = "pdf-sdk-demo"
compatibility_date = "2026-10-01"
main = "worker/index.ts"

# The site's own domain (registered at Spaceship, DNS on Cloudflare). Cloudflare
# creates the DNS records and certificates for custom domains itself.
routes = [
  { pattern = "lovelydoc.com", custom_domain = true },
  { pattern = "www.lovelydoc.com", custom_domain = true },
]
# Keep the old workers.dev address working for links already shared; with
# routes set, wrangler turns it off unless this says otherwise.
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Every page is a prerendered file; anything else is a real 404.
not_found_handling = "404-page"
# Only the API runs the Worker; every other request is a static file.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pdf-sdk-site"
database_id = "aaa330ba-8c43-4a98-a903-82f5d5e3309e"
migrations_dir = "migrations"
