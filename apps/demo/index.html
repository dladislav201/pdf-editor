<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-->
    <meta name="description" content="Edit any PDF right in your browser: change text, fix scans, sign and mark up. Files never leave your device." />
    <title>Edit PDF online, privately</title>
    <!--/seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <!-- The theme before the first paint, so a dark page never flashes light while the app loads (same rule as src/theme.ts). -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
