# The site in every browser profile once a day (and on demand): Firefox and
# desktop Safari are checked here rather than on every push.
name: Nightly browsers

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Site in Chromium, Firefox, WebKit, iPhone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    # Firefox refuses to run as root with the container's own home.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
